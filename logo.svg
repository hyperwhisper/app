<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18"
                    flood-color="#2A1065" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- rounded-square app tile, macOS proportions -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>

  <!-- omega: open ring + two flared feet.
       translate centres the glyph in the tile: its own bounding box runs
       y 217-733, which sits 37px above the tile centre without this. -->
  <g transform="translate(0 37)" fill="none" stroke="#FFFFFF" stroke-width="86"
     stroke-linecap="round" filter="url(#drop)">
    <path d="M 363.5 618.5 A 210 210 0 1 1 660.5 618.5"/>
    <path d="M 255 690 H 400"/>
    <path d="M 624 690 H 769"/>
  </g>
</svg>
